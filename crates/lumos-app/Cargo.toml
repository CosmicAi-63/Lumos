[package]
name = "lumos-app"
version = "0.1.0"
edition = "2024"
build = "build.rs"
description = "Lumos desktop app: recording toolbar, camera bubble and library, as a client of the engine."

[dependencies]
lumos-core = { version = "0.1.0", path = "../lumos-core" }
lumos-model = { version = "0.1.0", path = "../lumos-model" }
lumos-rpc = { version = "0.1.0", path = "../lumos-rpc" }
serde_json = "1.0.154"
tauri = { version = "2", features = ["macos-private-api", "protocol-asset", "tray-icon", "image-png"] }
tokio = { version = "1.54.1", features = ["process", "sync", "io-util"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[[bin]]
name = "lumos-app"
path = "src/main.rs"

[package]
name = "lumos-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.10", features = ["derive"] }
lumos-model = { version = "0.1.0", path = "../lumos-model" }
lumos-rpc = { version = "0.1.0", path = "../lumos-rpc" }
lumos-tools = { version = "0.1.0", path = "../lumos-tools" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "lumos"
path = "src/main.rs"

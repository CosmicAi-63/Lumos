[package]
name = "lumos-core"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
libc = "0.2.191"
lumos-capture = { version = "0.1.0", path = "../lumos-capture" }
lumos-media = { version = "0.1.0", path = "../lumos-media" }
lumos-model = { version = "0.1.0", path = "../lumos-model" }
lumos-rpc = { version = "0.1.0", path = "../lumos-rpc" }
lumos-tools = { version = "0.1.0", path = "../lumos-tools" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
